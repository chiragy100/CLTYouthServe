<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Opportunities | CLT YouthServe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/opportunities.css" />
  </head>
  <body class="opps-page">
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="images/CLT Logo.png" alt="Logo" class="web-logo" />CLT<span>YouthServe</span>
        </a>
      </div>
      <div class="nav-links">
        <a href="opportunities.html" class="active">Opportunities</a>
        <div class="nav-auth" id="auth-menu">
          <a href="login.html" class="login">Sign In</a>
          <a href="signup.html" class="btn-nav">Join Now</a>
        </div>
      </div> 
    </nav>

    <div class="search-filter-bar">
      <form class="filter-container" onsubmit="event.preventDefault();">
        <input type="text" id="search-input" placeholder="Search causes (e.g. Tutoring, Environment)" class="search-input" />
        
        <select id="category-filter" class="filter-select" aria-label="Filter by Category">
          <option value="">All Categories</option>
          <option value="Community Support">Community Support</option>
          <option value="Parks & Recreation">Parks & Recreation</option>
          <option value="Youth & Education">Youth & Education</option>
          <option value="Animal Welfare">Animal Welfare</option>
          <option value="Health & Wellness">Health & Wellness</option>
        </select>

        <select id="radius-filter" class="filter-select" aria-label="Filter by Distance">
          <option value="">Any Distance</option>
          <option value="5">Within 5 miles</option>
          <option value="10">Within 10 miles</option>
          <option value="25">Within 25 miles</option>
          <option value="50">Within 50 miles</option>
        </select>
      </form>
    </div>

    <main class="opps-layout">
      <section class="listings-container">
        <div class="results-header">
          <h2>Volunteer Opportunities in <span>Charlotte</span></h2>
          <div class="stats-bar">
            <div class="stat-pill">
              <strong id="opp-count">0</strong>
              <span>Opportunities</span>
            </div>
            <div class="stat-pill">
              <strong>100%</strong>
              <span>Verified</span>
            </div>
            <div class="stat-pill">
              <strong>14+</strong>
              <span>Age Friendly</span>
            </div>
          </div>
        </div>

        <div class="listings-grid" id="listings-grid"></div>
      </section>

      <section class="map-view">
        <div id="interactive-map"></div>
      </section>
    </main>

    <div id="opp-modal" class="modal-overlay">
      <div class="modal-content">
        <button class="close-modal" type="button" aria-label="Close opportunity details">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="js/source.js"></script>
    <script type="module" src="js/opportunities.js"></script>
  </body>
</html>
