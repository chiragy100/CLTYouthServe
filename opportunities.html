<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Opportunities | CLT YouthServe</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/opportunities.css" />
  </head>
  <body class="opps-page">
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="images/CLT Logo.png" alt="Logo" class="web-logo" />CLT<span
            >YouthServe</span
          >
        </a>
      </div>
      <div class="nav-links">
        <a href="opportunities.html" class="active">Opportunities</a>
        <div class="nav-auth" id="auth-menu">
          <a href="login.html" class="login">Sign In</a>
          <a href="signup.html" class="btn-nav">Join Now</a>
        </div>
      </div>
    </nav>

    <div class="search-filter-bar">
      <form class="filter-container">
        <input
          type="text"
          placeholder="Search causes (e.g. Tutoring, Environment)"
          class="search-input"
        />
        <select class="filter-select" aria-label="Filter by Category">
          <option value="">Category</option>
          <option value="education">Education</option>
          <option value="environment">Environment</option>
          <option value="hunger">Hunger Relief</option>
        </select>
        <select class="filter-select" aria-label="Filter by Age Group">
          <option value="">Age Group</option>
          <option value="middle">Middle School</option>
          <option value="high">High School</option>
        </select>
      </form>
    </div>

    <main class="opps-layout">
      <section class="listings-container">
        <div class="results-header">
          <h2>Volunteer Opportunities in <span>Charlotte</span></h2>
          <p>Showing 1 opportunity</p>
        </div>

        <div class="listings-grid">
          <div class="opp-card">
            <div class="opp-img matthews-help-img">
              <span class="category-tag status-closed">Closed</span>
            </div>

            <div class="opp-content">
              <h3>Matthews Help Center</h3>
              <p class="org-name">Community Help & Thrift</p>

              <div class="opp-details">
                <span>📍 Matthews, NC</span>
                <span>⏱️ 3 Hour Shifts</span>
              </div>

              <a
                href="https://matthewshelpcenter.org/"
                target="_blank"
                rel="noopener"
                class="btn-card btn-disabled"
              >
                Currently Full
              </a>
            </div>
          </div>
        </div>
      </section>

      <section class="map-view">
        <div id="interactive-map"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/source.js"></script>

    <script src="js/opportunities.js"></script>
  </body>
</html>
